<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sentinel Management</title>
    <link rel="stylesheet" href="./management.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="topbar-brand">
            <h1>Sentinel Management</h1>
            <p class="sub">Active technician links grouped by user.</p>
          </div>
          <div class="user-chip" aria-label="Signed in as Jamie" title="Jamie">
            <span class="user-chip-avatar" aria-hidden="true">J</span>
          </div>
        </div>
      </header>

      <main class="content">
        <section class="card" id="allTechLinksCard">
          <h2>Active tech links</h2>
          <p class="sub">Every active technician URL, grouped by user.</p>
          <div id="allTechLinkStatus" class="status" role="status"></div>
          <div id="allTechLinksByUser"></div>
          <div class="empty" id="allTechLinksEmpty">No active tech links.</div>
        </section>
      </main>
    </div>
    <script src="./management.js"></script>
  </body>
</html>
